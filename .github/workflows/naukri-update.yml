name: Naukri Profile Update

on:
  schedule:
    # 8:30 AM IST = 3:00 AM UTC
    - cron: '0 3 * * *'
    # 8:00 PM IST = 2:30 PM UTC
    - cron: '30 14 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger Naukri profile update
        run: |
          echo "=== Triggering Naukri profile update ==="
          
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.AUTOPILOT_BACKEND_URL }}/api/profile/update" \
            -H "Content-Type: application/json" \
            -d '{"provider":"naukri","trigger":"CRON","dryRun":false}')
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Profile update failed with HTTP $http_code"
            exit 1
          fi
          
          echo "✅ Profile update completed successfully"
