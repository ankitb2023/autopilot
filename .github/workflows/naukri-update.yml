name: Naukri Automation

on:
  schedule:
    # 1) Keep Render server awake (prevents IP drift that kills sessions)
    - cron: '*/14 * * * *'
    # 2) Refresh session every hour (keeps Naukri cookies alive)
    - cron: '0 * * * *'
    # 3) Update profile at 7:00 AM IST (1:30 AM UTC)
    - cron: '30 1 * * *'
    # 4) Update profile at 7:00 PM IST (1:30 PM UTC)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - refresh
          - ping

jobs:
  naukri:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: ⏱️ Keep-Alive Ping (Render)
        if: github.event.schedule == '*/14 * * * *' || github.event.inputs.action == 'ping'
        run: |
          echo "Pinging server to prevent sleep and IP drift..."
          curl -s --max-time 120 "${{ secrets.AUTOPILOT_BACKEND_URL }}/health" || true

      - name: 🔄 Refresh Naukri Session
        if: github.event.schedule == '0 * * * *' || github.event.inputs.action == 'refresh'
        run: |
          echo "=== Refreshing Naukri session ==="
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.AUTOPILOT_BACKEND_URL }}/api/auth/refresh" \
            -H "Content-Type: application/json" \
            --max-time 30)
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Refresh: HTTP $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Session refresh failed (HTTP $http_code). Session may need re-seeding."
            exit 1
          fi

      - name: 📝 Update Naukri Profile
        if: github.event.schedule == '30 1 * * *' || github.event.schedule == '30 13 * * *' || github.event.inputs.action == 'update'
        run: |
          echo "=== Updating Naukri profile ==="
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.AUTOPILOT_BACKEND_URL }}/api/profile/update" \
            -H "Content-Type: application/json" \
            -d '{"provider":"naukri","trigger":"CRON","dryRun":false}' \
            --max-time 60)
          
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Profile update failed with HTTP $http_code"
            exit 1
          fi
          
          echo "✅ Profile updated successfully"
