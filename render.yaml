services:
  - type: web
    name: autopilot-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autopilot-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 8080

databases:
  - name: autopilot-db
    region: frankfurt
    plan: free
    postgresMajorVersion: 16
